# Lint and unit tests. Runs on pushes to main and on pull requests, and the release workflow calls it so
# that a tag cannot publish unless these checks pass. Nothing here calls the Bitdeer AI API.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  UV_FROZEN: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Lint and type-check
        run: make lint

      - name: Check that every module imports
        run: make check_imports

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        run: make test

      # Collects the integration tests without running them, so a broken import fails here even though
      # the live tests are skipped without an API key.
      - name: Check that the integration tests compile
        run: uv run --group test --group test_integration pytest -m compile tests/integration_tests

      - name: Check that the tests left no changes
        run: test -z "$(git status --porcelain)"
